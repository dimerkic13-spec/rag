name: Pilot deployment checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_offline.py
      - run: python -m unittest discover -s tests/integration -v
      - if: runner.os == 'Linux'
        run: |
          bash infra/dify/install-linux.sh prepare
          bash infra/dify/install-linux.sh check
