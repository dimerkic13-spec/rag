name: Offline checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "20 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_offline.py
